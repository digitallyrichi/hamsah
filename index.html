    <script>
      (function() {
        const storedTheme = localStorage.getItem('hamsah-theme');
        if (storedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
